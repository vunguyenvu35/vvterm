<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 420" width="1400" height="420" role="img" aria-label="VVTerm">
  <title>VVTerm</title>
  
  <g transform="translate(30 30) scale(0.3516)">
      <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1530"/>
      <stop offset="1" stop-color="#070A18"/>
    </linearGradient>
    <linearGradient id="stroke" x1="180" y1="300" x2="850" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5B8CFF"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="470" r="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3D6BDB" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3D6BDB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#7DE7F7"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="tile"><rect width="1024" height="1024" rx="228"/></clipPath>
  </defs>
    
  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#glow)"/>

    <!-- faint circuit traces -->
    <g fill="none" stroke="#5B8CFF" stroke-opacity="0.16" stroke-width="6" stroke-linecap="round">
      <path d="M0 214H196L250 160H420"/>
      <path d="M1024 250H860L808 198H690"/>
      <path d="M0 842H150L214 906H330"/>
      <path d="M1024 780H904L850 834H740"/>
      <path d="M512 0V120"/>
    </g>
    <g fill="#5B8CFF" fill-opacity="0.28">
      <circle cx="420" cy="160" r="9"/><circle cx="690" cy="198" r="9"/>
      <circle cx="330" cy="906" r="9"/><circle cx="740" cy="834" r="9"/><circle cx="512" cy="120" r="9"/>
    </g>

    <!-- W = V + V -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="206,296 344,716 512,392 680,716 818,296" stroke="url(#stroke)" stroke-width="150" stroke-opacity="0.22" filter="url(#soft)"/>
      <polyline points="206,296 344,716 512,392 680,716 818,296" stroke="url(#stroke)" stroke-width="76"/>
      <!-- inner highlight -->
      <polyline points="206,296 344,716 512,392 680,716 818,296" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="14" transform="translate(-6,-8)"/>
    </g>

    <!-- network nodes -->
    <g>
      <circle cx="206" cy="296" r="40" fill="#0A0F22" stroke="#5B8CFF" stroke-width="14"/>
      <circle cx="344" cy="716" r="40" fill="#0A0F22" stroke="#22D3EE" stroke-width="14"/>
      <circle cx="680" cy="716" r="40" fill="#0A0F22" stroke="#22D3EE" stroke-width="14"/>
      <circle cx="818" cy="296" r="40" fill="#0A0F22" stroke="#A78BFA" stroke-width="14"/>
      <!-- AI core -->
      <circle cx="512" cy="392" r="104" fill="url(#core)" opacity="0.9"/>
      <circle cx="512" cy="392" r="50" fill="#0A0F22" stroke="#FFFFFF" stroke-width="14"/>
      <circle cx="512" cy="392" r="18" fill="#7DE7F7"/>
    </g>

    <!-- terminal cursor -->
    <rect x="434" y="808" width="156" height="30" rx="15" fill="#22D3EE"/>
  </g>
  </g>
  <defs>
    <linearGradient id="wm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5B8CFF"/><stop offset="0.55" stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>
  <text x="440" y="250" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="150" font-weight="800" letter-spacing="-4">
    <tspan fill="url(#wm)">VV</tspan><tspan fill="#F2F5FF">Term</tspan><tspan fill="#22D3EE">_</tspan>
  </text>
  <text x="444" y="320" font-family="Inter,'SF Pro Text',Helvetica,Arial,sans-serif" font-size="34" letter-spacing="9" fill="#8B93A5">SECURE · SYNCED · YOURS</text>
</svg>
