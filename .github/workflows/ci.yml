name: ci
# Paused: runs only when started by hand (Actions tab -> ci -> Run workflow).
# To turn it back on, replace `workflow_dispatch:` with the two triggers below.
#   push:
#     branches: [main]
#   pull_request:
on:
  workflow_dispatch:

# the jobs only read the repository
permissions:
  contents: read

jobs:
  go:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build frontend (the Go embed needs frontend/dist)
        run: cd frontend && npm ci && npm run build
      - run: go vet ./...
      - run: go test -race -count=1 -cover ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd frontend && npm ci && npx tsc --noEmit && npx vitest run

  build:
    needs: [go, frontend]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
      - run: $(go env GOPATH)/bin/wails build -ldflags "-X vvterm/app.Version=${{ github.sha }}"
